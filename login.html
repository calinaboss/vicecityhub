<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account &bull; ViceCityHub.eu</title>
  <meta name="description" content="Log in or create your account on ViceCityHub.eu.">
  <meta name="theme-color" content="#0d1117">

  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand-wrapper">
        <a href="index.html" class="brand-logo" aria-label="ViceCityHub Homepage">
          <img src="assets/brand/logo.png" alt="ViceCityHub" class="brand-logo-img">
        </a>
      </div>
      <a href="index.html" class="btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back to Hub
      </a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); width: 100%; max-width: 420px; padding: 28px;">
      
      <div style="text-align: center; margin-bottom: 22px;">
        <img src="assets/brand/logo.png" alt="ViceCityHub" style="height: 38px; width: auto; margin: 0 auto 8px;">
        <h1 style="font-size: 1.25rem; font-weight: 700; color: var(--text-main);" id="auth-title">Welcome to ViceCityHub</h1>
        <p style="font-size: 0.82rem; color: var(--text-muted);" id="auth-subtitle">Log in to your account</p>
      </div>

      <!-- Auth Tabs -->
      <div style="display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
        <button id="tab-login" class="nav-link active" style="flex: 1; justify-content: center;">Log in</button>
        <button id="tab-signup" class="nav-link" style="flex: 1; justify-content: center;">Sign in</button>
      </div>

      <form id="auth-form" style="display: flex; flex-direction: column; gap: 14px;" onsubmit="event.preventDefault(); alert('Frontend prototype: Authentication system ready to connect to your backend.');">
        <div class="form-group">
          <label class="form-label">Email or Username</label>
          <input type="text" class="form-input" placeholder="player@vicecityhub.eu" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-post" style="width: 100%; justify-content: center; margin-top: 6px;">
          Continue
        </button>
      </form>

      <div style="text-align: center; margin-top: 18px; font-size: 0.78rem; color: var(--text-dim);">
        By continuing, you agree to our <a href="terms.html" style="color: var(--accent-pink);">Terms of Service</a> and <a href="privacy.html" style="color: var(--accent-pink);">Privacy Policy</a>.
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-bottom-bar" style="margin-top: 0; border-top: none;">
      <p class="footer-disclaimer-text">&copy; 2026 ViceCityHub.eu &bull; Unofficial GTA VI Community Portal.</p>
      <a href="index.html" style="color: var(--accent-pink); font-size: 0.82rem;">Return to Homepage</a>
    </div>
  </footer>

  <script>
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');

    function setTab(tab) {
      if (tab === 'signup') {
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
        authTitle.textContent = 'Create an Account';
        authSubtitle.textContent = 'Join GTA VI\'s community hub';
      } else {
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
        authTitle.textContent = 'Welcome Back';
        authSubtitle.textContent = 'Log in to your account';
      }
    }

    tabLogin.addEventListener('click', () => setTab('login'));
    tabSignup.addEventListener('click', () => setTab('signup'));

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('tab') === 'signup' || urlParams.get('tab') === 'register') {
      setTab('signup');
    }
  </script>
</body>
</html>
